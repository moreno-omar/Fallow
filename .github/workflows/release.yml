name: Release

# Builds the three downloadable packages described in flatpak_appimage_build.md
# and attaches them to a GitHub Release:
#
#   git tag v0.14.2
#   git push origin v0.14.2
#
# The tag's version (without the leading "v") names the AppImage and the
# tarball, so the artifacts always match the release they ship with. The same
# work can be run from the Actions tab with "Run workflow", which asks for the
# version tag.
#
# The jobs run on different images on purpose. The AppImage and the tarball are
# plain files that run against the host's libraries, so they are built on the
# oldest still-supported runner (22.04) to keep the glibc floor low; both are
# built in one job so they share a single staged payload. The Flatpak runs
# against the KDE runtime rather than the host, so its job can use the newer
# runner and get a flatpak-builder that is not affected by flatpak#6818.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build and publish, e.g. v0.14.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Normalise the requested tag
        id: tag
        env:
          # A tag push carries the tag in github.ref_name; a manual run has only
          # the input, because github.ref_name is then the branch.
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ "${REQUESTED}" == v* ]]; then
            tag="${REQUESTED}"
          else
            tag="v${REQUESTED}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${tag} is not a vMAJOR.MINOR.PATCH version tag"
            exit 1
          fi
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${tag}"

  bundles:
    name: AppImage and portable tarball
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install appimagetool
        run: |
          curl -fL --retry 3 -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build the AppImage
        env:
          FALLOW_VERSION: ${{ needs.prepare.outputs.version }}
          # appimagetool is itself an AppImage and FUSE is not guaranteed on a
          # runner, so let it unpack and run instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash appimage/build-appimage.sh

      # A build that produces a file but cannot import its own Qt is worse than
      # a failed build, so unpack the image and make it prove it starts.
      - name: Smoke-test the AppImage
        run: |
          image="dist/Fallow-${{ needs.prepare.outputs.version }}-x86_64.AppImage"
          "./${image}" --appimage-extract >/dev/null
          squashfs-root/usr/python/bin/python3 -P -c \
            "import PySide6, pymupdf, numpy; print('bundled interpreters ok')"
          rm -rf squashfs-root

      # The tarball carries the same payload, so it reuses the AppDir instead of
      # downloading the interpreter and the wheels a second time.
      - name: Build the portable tarball
        env:
          FALLOW_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash tarball/build-tarball.sh --payload build/appimage/Fallow.AppDir

      # QtWidgets needs the desktop libraries a real machine has. The runner
      # image carries most of them but not the GL/EGL pair, so importing the
      # app there would fail for a reason that says nothing about the package.
      - name: Install the libraries Qt links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libx11-6 libxcb1 libxrender1 libxi6 libsm6 libice6 libxext6

      # Install it the way a reader would - unpack, run install.sh - and check
      # that the menu entry and the bundled interpreter came out usable.
      - name: Smoke-test the tarball
        run: |
          version="${{ needs.prepare.outputs.version }}"
          work="$(mktemp -d)"
          tar -xzf "dist/Fallow-${version}-x86_64.tar.gz" -C "${work}"
          bundle="${work}/Fallow-${version}-x86_64"

          "${bundle}/install.sh" --prefix "${work}/prefix"
          install_dir="${work}/prefix/lib/fallow"
          grep -q "Exec=\"${work}/prefix/bin/fallow\"" \
            "${work}/prefix/share/applications/org.fallow.PdfReader.desktop"
          PYTHONPATH="${install_dir}/usr/share/fallow" \
            "${install_dir}/usr/python/bin/python3" -P -c \
            "import app.main, PySide6, pymupdf, numpy; print('packaged application ok')"

          "${install_dir}/uninstall.sh" --prefix "${work}/prefix"
          test ! -e "${install_dir}"
          rm -rf "${work}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  # Known broken, deliberately non-blocking. Ubuntu 24.04's AppStream 1.0.2
  # fails flatpak-builder's compose step with "file-read-error" for every app
  # (the same invocation succeeds on AppStream 1.1), and the image has no
  # eu-strip. A failed Flatpak build must not stop the AppImage and the tarball
  # - the two packages this pipeline exists to ship - from being published.
  # Once the job runs where its metadata can be composed, drop
  # continue-on-error and the release gets the third package back.
  flatpak:
    name: Flatpak
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak, flatpak-builder, and eu-strip
        run: |
          sudo apt-get update
          # eu-strip (elfutils) is what flatpak-builder strips binaries with;
          # the Ubuntu images ship flatpak-builder without it.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils

      - name: Add the Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the Flatpak
        run: bash flatpak/build-flatpak.sh

      # The bundle name is fixed inside the build script; releases carry the
      # version so two downloads cannot be confused for one another.
      - name: Stage the bundle
        run: |
          mkdir -p dist
          cp build/flatpak/org.fallow.PdfReader.flatpak \
             "dist/Fallow-${{ needs.prepare.outputs.version }}-x86_64.flatpak"

      - name: Smoke-test the Flatpak
        run: |
          flatpak install --user -y --noninteractive \
            build/flatpak/org.fallow.PdfReader.flatpak
          flatpak run --command=python3 --env=PYTHONPATH=/app/lib/fallow \
            --env=QT_QPA_PLATFORM=offscreen \
            org.fallow.PdfReader -P -c \
            "import PySide6, pymupdf, numpy; print('bundled interpreters ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [prepare, bundles, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # A download can be checked against this file, so a truncated or swapped
      # artifact is caught rather than trusted. The Flatpak job is non-blocking,
      # so the glob must tolerate it being absent.
      - name: Write the checksums
        working-directory: assets
        run: |
          shopt -s nullglob
          files=(Fallow-*.AppImage Fallow-*.tar.gz Fallow-*.flatpak)
          if (( ${#files[@]} == 0 )); then
            echo "::error::no packages were uploaded by the build jobs"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: List the assets
        run: ls -lh assets

      # The body is generated from the assets that actually arrived, so a
      # release never advertises a package it does not carry.
      - name: Write the release notes
        working-directory: assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "Download the package you want. None of them needs Python or a"
            echo "source checkout on the machine that installs it."
            echo
            if compgen -G 'Fallow-*.tar.gz' > /dev/null; then
              echo "**Portable tarball** - unpack, then install (or just run it in place):"
              echo
              echo '```bash'
              echo 'sha256sum -c SHA256SUMS'
              echo "tar -xzf Fallow-${VERSION}-x86_64.tar.gz"
              echo "cd Fallow-${VERSION}-x86_64"
              echo './install.sh              # into ~/.local, no root needed'
              echo 'fallow document.pdf'
              echo '```'
              echo
            fi
            if compgen -G 'Fallow-*.AppImage' > /dev/null; then
              echo "**AppImage** - nothing to install:"
              echo
              echo '```bash'
              echo "chmod +x Fallow-${VERSION}-x86_64.AppImage"
              echo "./Fallow-${VERSION}-x86_64.AppImage document.pdf"
              echo '```'
              echo
            fi
            if compgen -G 'Fallow-*.flatpak' > /dev/null; then
              echo "**Flatpak** - installs for the current user:"
              echo
              echo '```bash'
              echo "flatpak install --user -y Fallow-${VERSION}-x86_64.flatpak"
              echo "flatpak run org.fallow.PdfReader"
              echo '```'
              echo
            fi
            echo "Every package accepts document paths as arguments. Check a download"
            echo "with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "See the [build documentation](https://github.com/${REPO}/blob/main/flatpak_appimage_build.md)"
            echo "for what each package needs at runtime."
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Fallow ${{ needs.prepare.outputs.version }}
          fail_on_unmatched_files: true
          body_path: assets/RELEASE_BODY.md
          files: |
            assets/Fallow-*
            assets/SHA256SUMS
